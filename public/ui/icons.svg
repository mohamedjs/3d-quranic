<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
<!-- Quran Journey v4 UI Icon Set — filled gold glyphs with 2 px dark-gold outline.
     All symbol ids match the game's existing sprite contract. No people or faces. -->
<defs>
  <linearGradient id="ig-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff4c8"/>
    <stop offset=".48" stop-color="#f4c766"/>
    <stop offset="1" stop-color="#c98a2e"/>
  </linearGradient>
</defs>

<!-- Dock: Stories (explorer's backpack / satchel) -->
<symbol id="i-stories" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M9 6V4.6A2.6 2.6 0 0 1 11.6 2h.8A2.6 2.6 0 0 1 15 4.6V6"/>
    <rect x="4.5" y="6" width="15" height="15" rx="4.2"/>
  </g>
  <g fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 10.6c2.2 1.8 4.6 2.6 7 2.6s4.8-.8 7-2.6"/>
    <rect x="9.6" y="11.6" width="4.8" height="3.2" rx="1" fill="var(--ic-fill, url(#ig-gold))"/>
    <path d="M8.5 17.6h7"/>
  </g>
</symbol>

<!-- Alias backpack icon -->
<symbol id="i-backpack" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M9 6V4.6A2.6 2.6 0 0 1 11.6 2h.8A2.6 2.6 0 0 1 15 4.6V6"/>
    <rect x="4.5" y="6" width="15" height="15" rx="4.2"/>
  </g>
  <g fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 10.6c2.2 1.8 4.6 2.6 7 2.6s4.8-.8 7-2.6"/>
    <rect x="9.6" y="11.6" width="4.8" height="3.2" rx="1" fill="var(--ic-fill, url(#ig-gold))"/>
    <path d="M8.5 17.6h7"/>
  </g>
</symbol>

<!-- Dock: Journal (open Quran book on a wooden rahle stand) -->
<symbol id="i-quran" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <!-- open book pages -->
    <path d="M3 6.2c3.2-.8 6.4 0 9 2.2 2.6-2.2 5.8-3 9-2.2v9.3c-3.2-.7-6.4.1-9 2.2-2.6-2.1-5.8-2.9-9-2.2z"/>
    <!-- crossed stand (rahle) -->
    <path d="M7.5 17.5L12 19.6l4.5-2.1 1.6 3.7h-2.5l-3.6-1.5-3.6 1.5H5.9z"/>
  </g>
  <g fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.35" stroke-linecap="round">
    <path d="M12 8.4v9.1"/>
    <path d="M5.6 9.6c1.5-.2 2.9.1 4.1.8M5.6 12.6c1.5-.2 2.9.1 4.1.8"/>
    <path d="M18.4 9.6c-1.5-.2-2.9.1-4.1.8M18.4 12.6c-1.5-.2-2.9.1-4.1.8"/>
  </g>
</symbol>

<!-- Dock: Map (ornate compass) -->
<symbol id="i-compass" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <circle cx="12" cy="12" r="9"/>
  </g>
  <g stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16.2 7.8l-2.3 6.1-6.1 2.3 2.3-6.1z" fill="var(--ic-stroke, #4a2a06)"/>
    <circle cx="12" cy="12" r="1.5" fill="var(--ic-fill, url(#ig-gold))"/>
    <path d="M12 4.5v1.4M12 18.1v1.4M4.5 12h1.4M18.1 12h1.4" fill="none"/>
  </g>
</symbol>

<!-- Folded map -->
<symbol id="i-map" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M3 6.2l6-2.4 6 2.4 6-2.4v14l-6 2.4-6-2.4-6 2.4z"/>
  </g>
  <path d="M9 3.8v14M15 6.2v14" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.45" stroke-linecap="round"/>
</symbol>

<!-- Star (points / score) -->
<symbol id="i-star" viewBox="0 0 24 24">
  <path d="M12 2.6l2.8 5.8 6.4.9-4.6 4.5 1.1 6.4L12 17.2l-5.7 3 1.1-6.4-4.6-4.5 6.4-.9z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" paint-order="stroke fill"/>
</symbol>

<!-- Lightbulb (lesson chip) -->
<symbol id="i-bulb" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M12 3a6.5 6.5 0 0 0-4.2 11.4c.7.6 1.2 1.5 1.2 2.4v.7h6v-.7c0-.9.5-1.8 1.2-2.4A6.5 6.5 0 0 0 12 3z"/>
    <path d="M9.5 19.6h5a1 1 0 0 1-1 1.4h-3a1 1 0 0 1-1-1.4z"/>
  </g>
  <path d="M12 7.5v3.5m-1.6-1.8L12 11l1.6-1.8" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- Speaker (listen again) -->
<symbol id="i-speaker" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M3.5 9.2h3.6l5.4-4.4v14.4l-5.4-4.4H3.5a1 1 0 0 1-1-1v-3.6a1 1 0 0 1 1-1z"/>
  </g>
  <g fill="none" stroke="var(--ic-fill, url(#ig-gold))" stroke-width="2.1" stroke-linecap="round">
    <path d="M15.8 8.8a4.6 4.6 0 0 1 0 6.4" stroke="var(--ic-stroke, #4a2a06)" stroke-width="3.6"/>
    <path d="M15.8 8.8a4.6 4.6 0 0 1 0 6.4"/>
    <path d="M18.6 6a8.5 8.5 0 0 1 0 12" stroke="var(--ic-stroke, #4a2a06)" stroke-width="3.6"/>
    <path d="M18.6 6a8.5 8.5 0 0 1 0 12"/>
  </g>
</symbol>

<!-- Pause -->
<symbol id="i-pause" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" paint-order="stroke fill">
    <rect x="6" y="4.8" width="4.4" height="14.4" rx="1.6"/>
    <rect x="13.6" y="4.8" width="4.4" height="14.4" rx="1.6"/>
  </g>
</symbol>

<!-- Play -->
<symbol id="i-play" viewBox="0 0 24 24">
  <path d="M7.5 5.2c0-1 1.1-1.6 2-1.1l10.2 6.8a1.3 1.3 0 0 1 0 2.2L9.5 19.9c-.9.5-2-.1-2-1.1z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" paint-order="stroke fill"/>
</symbol>

<!-- Replay -->
<symbol id="i-replay" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M12 4a8 8 0 1 0 7.7 10.2l-2.6-.7A5.4 5.4 0 1 1 12 6.6v2.7l5.4-4L12 1.3z"/>
  </g>
</symbol>

<!-- Dock: Settings (classic 8-tooth gear) -->
<symbol id="i-settings" viewBox="0 0 24 24">
  <path fill-rule="evenodd"
    d="M10.2 2.8h3.6l.6 2.3a7.2 7.2 0 0 1 1.8.8l2-1.2 2.5 2.5-1.2 2c.3.6.6 1.2.8 1.8l2.3.6v3.6l-2.3.6a7.2 7.2 0 0 1-.8 1.8l1.2 2-2.5 2.5-2-1.2a7.2 7.2 0 0 1-1.8.8l-.6 2.3h-3.6l-.6-2.3a7.2 7.2 0 0 1-1.8-.8l-2 1.2-2.5-2.5 1.2-2a7.2 7.2 0 0 1-.8-1.8l-2.3-.6v-3.6l2.3-.6c.2-.6.5-1.2.8-1.8l-1.2-2 2.5-2.5 2 1.2c.6-.3 1.2-.6 1.8-.8zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill"/>
</symbol>

<!-- Close -->
<symbol id="i-close" viewBox="0 0 24 24">
  <path d="M6.4 4.6L12 10.2l5.6-5.6 1.8 1.8L13.8 12l5.6 5.6-1.8 1.8L12 13.8l-5.6 5.6-1.8-1.8L10.2 12 4.6 6.4z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill"/>
</symbol>

<!-- Lock -->
<symbol id="i-lock" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M8 10V7.2a4 4 0 0 1 8 0V10" fill="none" stroke-width="3.2" stroke="var(--ic-stroke, #4a2a06)"/>
    <path d="M8 10V7.2a4 4 0 0 1 8 0V10" fill="none" stroke-width="1.9" stroke="var(--ic-fill, url(#ig-gold))"/>
    <rect x="4.5" y="10" width="15" height="11" rx="2.6"/>
  </g>
  <circle cx="12" cy="14.6" r="1.4" fill="var(--ic-stroke, #4a2a06)"/>
  <path d="M12 15.6v2.2" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.6" stroke-linecap="round"/>
</symbol>

<!-- Alert / Quest exclamation (objective & open story badge) -->
<symbol id="i-alert" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <rect x="10.1" y="3.2" width="3.8" height="11.2" rx="1.9"/>
    <circle cx="12" cy="18.9" r="2.2"/>
  </g>
</symbol>

<!-- Check -->
<symbol id="i-check" viewBox="0 0 24 24">
  <path d="M4.6 12.6l4.6 4.7 10.2-10.2 1.8 1.8-12 12-6.4-6.5z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill"/>
</symbol>

<!-- Chevron (dialogue next prompt) -->
<symbol id="i-chevron" viewBox="0 0 24 24">
  <path d="M5.5 8.5L12 15.5l6.5-7h-2.8L12 12.4 8.3 8.5z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.9" stroke-linejoin="round" paint-order="stroke fill"/>
</symbol>

<!-- Zoom in -->
<symbol id="i-zoom-in" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M16.2 14.5l4.4 4.4-1.7 1.7-4.4-4.4a7.2 7.2 0 1 1 1.7-1.7z"/>
  </g>
  <path d="M7.5 10.5h6M10.5 7.5v6" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.9" stroke-linecap="round"/>
</symbol>

<!-- Zoom out -->
<symbol id="i-zoom-out" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M16.2 14.5l4.4 4.4-1.7 1.7-4.4-4.4a7.2 7.2 0 1 1 1.7-1.7z"/>
  </g>
  <path d="M7.5 10.5h6" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.9" stroke-linecap="round"/>
</symbol>

<!-- Locate (center on player) -->
<symbol id="i-locate" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path fill-rule="evenodd" d="M11 2.2h2v3a7 7 0 0 1 5.8 5.8h3v2h-3a7 7 0 0 1-5.8 5.8v3h-2v-3A7 7 0 0 1 5.2 13h-3v-2h3A7 7 0 0 1 11 5.2zM12 7.4a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/>
    <circle cx="12" cy="12" r="2.2"/>
  </g>
</symbol>

<!-- Steps (auto-walk to story) -->
<symbol id="i-steps" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M7.8 6.4c2.1 0 3.3 2.3 3.1 4.6-.2 1.8-.8 3.2-1.2 4.4H4.9c-.4-1.2-.9-2.8-.9-4.5 0-2.4 1.6-4.5 3.8-4.5z"/>
    <path d="M4.8 17.2h5v1.4a2.5 2.5 0 0 1-5 0z"/>
    <path d="M17.4 2.8c2.1.4 3.1 2.8 2.6 5.1-.4 1.8-1 3.1-1.4 4.2l-4.7-.9c-.2-1.3-.5-2.8-.2-4.5.4-2.3 1.8-4.3 3.7-3.9z"/>
    <path d="M13.8 13.1l4.9.9-.3 1.4a2.5 2.5 0 0 1-4.9-.9z"/>
  </g>
</symbol>

<!-- Coin (crescent medallion) -->
<symbol id="i-coin" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="8.8" fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" paint-order="stroke fill"/>
  <circle cx="12" cy="12" r="6" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.2"/>
  <path d="M12 8.2l1.2 2.6 2.6 1.2-2.6 1.2L12 15.8l-1.2-2.6L8.2 12l2.6-1.2z" fill="var(--ic-stroke, #4a2a06)"/>
</symbol>

<!-- Prophets category tab (radiant stars, no people) -->
<symbol id="i-prophets" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill">
    <path d="M9.5 4.2l2.2 4.8 4.8 2.2-4.8 2.2-2.2 4.8-2.2-4.8-4.8-2.2 4.8-2.2z"/>
    <path d="M18 3.2l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z"/>
    <path d="M17.5 14.5l1.1 2.3 2.3 1.1-2.3 1.1-1.1 2.3-1.1-2.3-2.3-1.1 2.3-1.1z"/>
  </g>
</symbol>

<!-- Companions category tab (ornate lantern / fanoos — zero people) -->
<symbol id="i-companions" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <path d="M10.2 3.2h3.6l-.8 2h-2z"/>
    <path d="M7.5 7.4C8.4 5.8 10 5 12 5s3.6.8 4.5 2.4z"/>
    <path d="M7 7.6h10l-1.4 9.6H8.4z"/>
    <path d="M7.2 17.4h9.6l1.2 2.8H6z"/>
  </g>
  <g fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.35" stroke-linecap="round">
    <path d="M12 7.8v9.2"/>
    <path d="M9.8 12.2h4.4"/>
  </g>
</symbol>

<!-- Chat (talk prompt) -->
<symbol id="i-chat" viewBox="0 0 24 24">
  <path d="M12 3.4c5 0 9 3.6 9 8.1s-4 8.1-9 8.1c-1.5 0-3-.3-4.2-1L3.2 20l1.1-4.3A7.8 7.8 0 0 1 3 11.5c0-4.5 4-8.1 9-8.1z"
    fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" stroke-linejoin="round" paint-order="stroke fill"/>
  <g fill="var(--ic-stroke, #4a2a06)">
    <circle cx="8.6" cy="11.5" r="1.2"/><circle cx="12" cy="11.5" r="1.2"/><circle cx="15.4" cy="11.5" r="1.2"/>
  </g>
</symbol>

<!-- Translate / Language -->
<symbol id="i-translate" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <circle cx="12" cy="12" r="8.6"/>
  </g>
  <g fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.45" stroke-linecap="round">
    <ellipse cx="12" cy="12" rx="4" ry="8.4"/>
    <path d="M3.8 9.2h16.4M3.8 14.8h16.4"/>
  </g>
</symbol>

<!-- Reciter microphone (classic mic, no people) -->
<symbol id="i-mic" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
    <rect x="8.8" y="3.2" width="6.4" height="10.4" rx="3.2"/>
    <path d="M5.6 11.2a6.4 6.4 0 0 0 12.8 0h-2a4.4 4.4 0 0 1-8.8 0z"/>
    <path d="M11 17.4h2v2.4h3v1.6H8v-1.6h3z"/>
  </g>
</symbol>

<!-- Medal (difficulty setting) -->
<symbol id="i-medal" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill">
    <path d="M7.2 2.8h4.2l1.2 4.4H8.4zM16.8 2.8h-4.2l-1.2 4.4h4.2z"/>
    <circle cx="12" cy="14.4" r="6.8"/>
  </g>
  <path d="M12 10.6l1.1 2.4 2.6.3-1.9 1.8.5 2.6-2.3-1.3-2.3 1.3.5-2.6-1.9-1.8 2.6-.3z" fill="var(--ic-stroke, #4a2a06)"/>
</symbol>

<!-- HD -->
<symbol id="i-hd" viewBox="0 0 24 24">
  <rect x="3" y="4.5" width="18" height="15" rx="2.8" fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" paint-order="stroke fill"/>
  <path d="M6.6 9v6m0-3h3.2m0-3v6M13 9h2.2a2.5 2.5 0 0 1 0 6H13z" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- Voice waveform -->
<symbol id="i-voice" viewBox="0 0 24 24">
  <g fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill">
    <rect x="4" y="9" width="3" height="6" rx="1.5"/>
    <rect x="10.5" y="4.5" width="3" height="15" rx="1.5"/>
    <rect x="17" y="7.5" width="3" height="9" rx="1.5"/>
  </g>
</symbol>

<!-- Meaning / Text page -->
<symbol id="i-text" viewBox="0 0 24 24">
  <rect x="4" y="3.5" width="16" height="17" rx="2.6" fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" paint-order="stroke fill"/>
  <path d="M7.6 8.4h8.8M7.6 12h8.8M7.6 15.6h5.8" fill="none" stroke="var(--ic-stroke, #4a2a06)" stroke-width="1.65" stroke-linecap="round"/>
</symbol>

<!-- Auto-advance -->
<symbol id="i-auto" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="8.8" fill="var(--ic-fill, url(#ig-gold))" stroke="var(--ic-stroke, #4a2a06)" stroke-width="2.1" paint-order="stroke fill"/>
  <path d="M10 8.5l6.2 3.5L10 15.5z" fill="var(--ic-stroke, #4a2a06)"/>
</symbol>

<!-- Route / guided path -->
