<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
<!-- Quran Journey v4 ornaments: golden-hour title emblem, Mushaf verse-frame gold line art
     (corners, arabesque ends, rosettes, divider), map pins, region glyphs & dialogue speaker avatars.
     Injected inline (not display:none) so SVG gradients render everywhere. -->
<defs>
  <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff5cc"/><stop offset=".45" stop-color="#f4c766"/><stop offset="1" stop-color="#b87822"/>
  </linearGradient>
  <linearGradient id="g-gold-h" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffefb8"/><stop offset=".5" stop-color="#f4c766"/><stop offset="1" stop-color="#c98a2e"/>
  </linearGradient>
  <linearGradient id="g-gold-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c98a2e"/><stop offset=".5" stop-color="#ffe9a6"/><stop offset="1" stop-color="#c98a2e"/>
  </linearGradient>
  <radialGradient id="g-dusk" cx=".5" cy=".3" r=".8">
    <stop offset="0" stop-color="#ffd99a"/><stop offset=".55" stop-color="#f2b86b"/><stop offset="1" stop-color="#b86f45"/>
  </radialGradient>
  <radialGradient id="g-teal" cx=".5" cy=".35" r=".75">
    <stop offset="0" stop-color="#225765"/><stop offset="1" stop-color="#0f2a33"/>
  </radialGradient>
  <clipPath id="c-portrait"><circle cx="32" cy="32" r="31"/></clipPath>
</defs>

<!-- ============ title emblem: golden dome + twin minarets + crescent ============ -->
<symbol id="o-emblem" viewBox="0 0 200 124">
  <g fill="url(#g-gold)" stroke="#683d0b" stroke-width="1.1" stroke-linejoin="round" paint-order="stroke fill">
    <!-- crescent & spire -->
    <path d="M103.8 7.5a6.6 6.6 0 1 0 0 9.8 5.1 5.1 0 1 1 0-9.8z" transform="translate(-.6 -1.5)"/>
    <rect x="99" y="19" width="2" height="10" rx="1"/>
    <circle cx="100" cy="23.5" r="2.2"/>
    <!-- onion-pointed dome -->
    <path d="M100 28c-17.5 6.5-28 18.5-28 32v3h56v-3c0-13.5-10.5-25.5-28-32z"/>
    <rect x="66" y="61.5" width="68" height="6" rx="2.2"/>
    <!-- arched sanctuary hall -->
    <path fill-rule="evenodd" d="M62 67.5h76v42.5H62zM100 75c-6.4 0-9.5 5.2-9.5 11.8V110h19V86.8c0-6.6-3.1-11.8-9.5-11.8zM77 83.5c-3.5 0-5.2 3-5.2 6.8v11.7h10.4V90.3c0-3.8-1.7-6.8-5.2-6.8zM123 83.5c-3.5 0-5.2 3-5.2 6.8v11.7h10.4V90.3c0-3.8-1.7-6.8-5.2-6.8z"/>
    <!-- left minaret -->
    <path d="M39.5 29.5l5.5-13 5.5 13z"/><rect x="38.5" y="29.5" width="13" height="4" rx="1.2"/>
    <path fill-rule="evenodd" d="M40.8 33.5h8.4v24h3.2v4.8h-3.2v47.7h-8.4V62.3h-3.2v-4.8h3.2zM44 39.5h2v8h-2z"/>
    <circle cx="45" cy="14" r="2.1"/>
    <!-- right minaret -->
    <path d="M149.5 29.5l5.5-13 5.5 13z"/><rect x="148.5" y="29.5" width="13" height="4" rx="1.2"/>
    <path fill-rule="evenodd" d="M150.8 33.5h8.4v24h3.2v4.8h-3.2v47.7h-8.4V62.3h-3.2v-4.8h3.2zM154 39.5h2v8h-2z"/>
    <circle cx="155" cy="14" r="2.1"/>
    <!-- ornate arabesque baseline -->
    <path d="M12 112.5c30-4.2 60-4.2 88-1.2 28-3 58-3 88 1.2l-2 3.2c-29-3.2-58-3.2-86 0-28-3.2-57-3.2-86 0z"/>
  </g>
  <!-- delicate dome & arch highlights -->
  <path d="M84 52c2.2-8.2 8-14.5 15.2-18.5M100 32c3 9 4.2 19 4 28M100 32c-3 9-4.2 19-4 28" fill="none" stroke="#fff7dc" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="100" cy="114.2" r="2.6" fill="#fff3c4"/>
</symbol>

<!-- ============ verse frame: gold line-art corner, arabesque finial, 8-point rosette, divider ============ -->
<symbol id="o-corner" viewBox="0 0 72 72">
  <g fill="none" stroke="url(#g-gold-h)" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer & inner double corner frame -->
    <path d="M4 68V18C4 10.3 10.3 4 18 4h50" stroke-width="2"/>
    <path d="M10.5 68V21.5c0-6.1 4.9-11 11-11H68" stroke-width="1.15" stroke-opacity=".8"/>
    <!-- geometric corner bracket & filigree arabesque spiral -->
    <path d="M16 36c0-11 9-20 20-20 7.4 0 12.5 4.8 12.5 10.8 0 4.8-3.7 8.4-8.2 8.4-3.7 0-6.2-2.4-6.2-5.6 0-2.5 1.8-4.2 4-4.2" stroke-width="1.75"/>
    <path d="M16 36c0 9 3.6 16.5 9.5 22M36 16c9 0 16.5 3.6 22 9.5" stroke-width="1.35" stroke-opacity=".85"/>
    <path d="M10.5 45c3.5 0 6.5 2.4 8 5.5M45 10.5c0 3.5 2.4 6.5 5.5 8" stroke-width="1.15" stroke-opacity=".75"/>
    <!-- corner diamond knot -->
    <path d="M16.5 16.5l5.5 2.2-3.3 3.3z" stroke-width="1.2"/>
  </g>
  <g fill="url(#g-gold-h)">
    <!-- corner dart + palmette leaves + pearls -->
    <path d="M4.5 4.5l10 2.5-7.5 7.5z"/>
    <path d="M25.5 56c3.8 1.2 6.5 4.2 7 7.8-3.6-.8-6.4-3.6-7-7.8zM56 25.5c1.2 3.8 4.2 6.5 7.8 7-.8-3.6-3.6-6.4-7.8-7z"/>
    <circle cx="17.5" cy="17.5" r="2.6"/>
    <circle cx="38" cy="25.4" r="1.4"/>
    <circle cx="4" cy="65" r="1.5"/><circle cx="65" cy="4" r="1.5"/>
  </g>
</symbol>

<!-- eight-pointed Shamsa rosette (side ends of the verse frame) -->
<symbol id="o-rosette" viewBox="0 0 48 48">
  <g fill="none" stroke="url(#g-gold-h)" stroke-linejoin="round">
    <!-- outer 8-point star (two rotated squares) -->
    <rect x="10.5" y="10.5" width="27" height="27" rx="1.8" fill="#0f2a33" stroke-width="1.8"/>
    <rect x="10.5" y="10.5" width="27" height="27" rx="1.8" transform="rotate(45 24 24)" fill="#0f2a33" stroke-width="1.8"/>
    <!-- filigree petals -->
    <path d="M24 4.5l3.2 7.5 7.5-3.2-3.2 7.5 7.5 3.2-7.5 3.2 3.2 7.5-7.5-3.2L24 43.5l-3.2-7.5-7.5 3.2 3.2-7.5-7.5-3.2 7.5-3.2-3.2-7.5 7.5 3.2z" fill="url(#g-gold-h)" fill-opacity=".22" stroke-width="1.35"/>
    <!-- inner beaded halo -->
    <circle cx="24" cy="24" r="9.6" fill="#0f2a33" stroke-width="1.4"/>
    <circle cx="24" cy="24" r="6.4" stroke-width="1" stroke-dasharray="1.8 2.2"/>
  </g>
  <path d="M24 19l1.5 3.5L29 24l-3.5 1.5L24 29l-1.5-3.5L19 24l3.5-1.5z" fill="url(#g-gold-h)"/>
</symbol>

<!-- horizontal arabesque end-finial (top & bottom crown of the verse frame) -->
<symbol id="o-finial" viewBox="0 0 180 20">
  <g fill="none" stroke="#f4c766" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 10h54M118 10h54" stroke-width="1.4" stroke-opacity=".88"/>
    <path d="M62 10c7-7 15-7 22 0-7 7-15 7-22 0zM96 10c7-7 15-7 22 0-7 7-15 7-22 0z" stroke-width="1.5"/>
    <path d="M46 10c4-4 8-4 12 0M122 10c4-4 8-4 12 0" stroke-width="1.2" stroke-opacity=".85"/>
  </g>
  <g fill="url(#g-gold-h)">
    <path d="M90 2l4.2 8-4.2 8-4.2-8z"/>
    <circle cx="73" cy="10" r="1.6"/><circle cx="107" cy="10" r="1.6"/>
    <circle cx="8" cy="10" r="2"/><circle cx="172" cy="10" r="2"/>
  </g>
</symbol>

<!-- arabesque divider (title rule & verse header) -->
<symbol id="o-divider" viewBox="0 0 240 18">
  <g fill="none" stroke="#f4c766" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9h82M152 9h82" stroke-width="1.4" stroke-opacity=".88"/>
    <path d="M88 9c7-7 16-7 23 0-7 7-16 7-23 0zM129 9c7-7 16-7 23 0-7 7-16 7-23 0z" stroke-width="1.5"/>
    <path d="M68 9c5-4.5 11-4.5 16 0M156 9c5-4.5 11-4.5 16 0" stroke-width="1.2" stroke-opacity=".82"/>
  </g>
  <g fill="url(#g-gold-h)">
    <path d="M120 1.5l4.4 7.5-4.4 7.5-4.4-7.5z"/>
    <circle cx="100" cy="9" r="1.6"/><circle cx="140" cy="9" r="1.6"/>
    <circle cx="6" cy="9" r="2.1"/><circle cx="234" cy="9" r="2.1"/>
  </g>
</symbol>

